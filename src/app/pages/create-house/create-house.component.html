<div class="container mt-4">
    <h2 class="mb-4">Editar Inmueble</h2>
  
    <form [formGroup]="inmuebleForm" (ngSubmit)="onSave()">
  
      <!-- title -->
      <div class="mb-3">
        <label for="titulo" class="form-label">Título</label>
        
        <input type="text" id="titulo" class="form-control" value="{{inmueble.titulo}}" formControlName="titulo">
      </div>
      <!-- subtitle -->
      <div class="mb-3">
        <label for="subtitle" class="form-label">Descripción</label>
        <textarea id="subtitle" rows="2" class="form-control" value="{{inmueble.subtitulo}}" formControlName="subtitle"></textarea>
      </div>
      <!-- description -->
      <div class="mb-3">
        <label for="descripcion" class="form-label">Descripción</label>
        <textarea id="descripcion" rows="4" class="form-control" value="{{inmueble.descripcion}}" formControlName="descripcion"></textarea>
      </div>
  
      <!-- price -->
      <div class="mb-3">
        <label for="precio" class="form-label">Precio (€)</label>
        <input type="number" id="precio" class="form-control" value="{{inmueble.precio}}" formControlName="precio">
      </div>
  
      <!-- location -->
      <div class="mb-3">
        <label for="localidad" class="form-label">Localidad</label>
        <input type="text" id="localidad" class="form-control" value="{{inmueble.localidad}}" formControlName="localidad">
      </div>

      <!-- bathrooms -->
      <div class="mb-3">
        <label for="localidad" class="form-label">Baños</label>
        <input type="number" id="banios" class="form-control" value="{{inmueble.banios}}" formControlName="banios">
      </div>
      
      <!-- type of building -->
      <div class="mb-3">
        <label for="tipoInmueble" class="form-label">Tipo de inmueble</label>
        <select id="tipoInmueble" class="form-select" formControlName="tipoInmuebleId">
          <option *ngFor="let tipo of tiposInmueble" [value]="tipo.id">{{ tipo.nombre }}</option>
        </select>
      </div>
  
      <!-- type of contract -->
      <div class="mb-3">
        <label for="tipoContrato" class="form-label">Tipo de contrato</label>
        <select id="tipoContrato" class="form-select" formControlName="tipoContratoId">
          <option *ngFor="let contrato of tiposContrato" [value]="contrato.id">{{ contrato.nombre }}</option>
        </select>
      </div>
  
      
      <button type="submit" class="btn btn-success" [disabled]="inmuebleForm.invalid">Guardar cambios</button>
    </form>
  </div>
