<div class="d-flex justify-content-center align-items-center vh-100 bg-light">
    <div class="card p-4 shadow-sm" style="width: 100%; max-width: 400px;">
      <h2 class="text-center mb-4 text-primary">Cordón Lara Inmobiliaria</h2>
  
      <form (ngSubmit)="login()" #loginForm="ngForm">
        <div class="mb-3">
          <label for="usuario" class="form-label">Nombre de usuario</label>
          <input
            type="text"
            class="form-control"
            id="usuario"
            name="usuario"
            [(ngModel)]="usuario"
            required
          />
        </div>
  
        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input
            type="password"
            class="form-control"
            id="password"
            name="password"
            [(ngModel)]="password"
            required
          />
        </div>
  
        <button type="submit" class="btn btn-primary w-100" [disabled]="!loginForm.valid">
          Iniciar sesión
        </button>
  
        <div *ngIf="errorMessage" class="text-danger text-center mt-3">
          {{ errorMessage }}
        </div>
      </form>
    </div>
  </div>
