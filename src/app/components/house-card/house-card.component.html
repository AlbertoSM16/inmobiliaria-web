<div class="container bg-light card col text-center">
  <img [src]="'../../assets/' + inmueble.foto_principal" class="w-50 d-block mx-auto pt-4">
  <h2 class="text-lg font-bold">{{ inmueble.titulo }}</h2>
  <p>{{ inmueble.descripcion }}</p>
  <p class="text-lg font-semibold">{{ inmueble.precio }} €</p>
  <div class="d-flex justify-content-center gap-2 my-4">
    
    <button class="btn btn-primary " (click)="goToDetail()">
      Consultar más información
    </button>
    <button class="btn btn-warning px-2 py-1 d-flex align-items-center justify-content-center" style="width: 38px; height: 38px;" (click)="goToEdit()">
      <i class="bi bi-pencil-square fs-5"></i>
    </button>
    
  </div>

</div>
